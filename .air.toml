root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/server/main.go"
entrypoint = "./tmp/main"
full_bin = ""
include_ext = ["go", "json", "sql", "yaml", "html"]
exclude_dir = ["tmp", "vendor", "web", "tests", ".git"]
include_dir = ["cmd", "internal"]
delay = 500
stop_on_error = true
log = "build-errors.log"
send_interrupt = true
kill_delay = 500

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
