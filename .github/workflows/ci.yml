name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce_secret
          POSTGRES_DB: ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Run Backend Tests
        env:
          DATABASE_URL: "host=localhost user=ecommerce password=ecommerce_secret dbname=ecommerce_db port=5432 sslmode=disable"
        run: |
          go test -v -race ./...

      - name: Run Concurrency Benchmark
        env:
          DATABASE_URL: "host=localhost user=ecommerce password=ecommerce_secret dbname=ecommerce_db port=5432 sslmode=disable"
        run: |
          go test -v -race tests/concurrency_test.go

      - name: Build Backend Binary
        run: |
          go build -ldflags="-s -w" -o bin/server cmd/server/main.go

      - name: Build Web Application
        run: |
          cd web
          npm ci
          npm run build

      - name: Build Docker Images
        run: |
          docker compose build
